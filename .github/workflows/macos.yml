name: macOS build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build macOS app
    # Apple Silicon runner, so the app is built for Apple Silicon Macs.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build app
        run: ./build.sh

      # Ad-hoc signature (done by build.sh): the app is not notarized, but macOS lets it run after "Open Anyway".
      - name: Verify signature and package DMG
        run: |
          APP="build/AgentTray.app"
          codesign --verify --deep --strict "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "AgentTray" -srcfolder dmg -ov -format UDZO agenttray-macos.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: agenttray-macos-${{ github.run_number }}
          path: agenttray-macos.dmg
          if-no-files-found: error

      # Rolling pre-release with a stable download link.
      - name: Publish DMG to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-macos --cleanup-tag --yes || true
          gh release create latest-macos agenttray-macos.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest macOS build (#${{ github.run_number }})" \
            --notes "macOS app (Apple Silicon) built from ${GITHUB_SHA::7} by run #${{ github.run_number }}."
